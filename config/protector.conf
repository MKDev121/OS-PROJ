# ==============================================================================
# Interactive Session Protector Configuration File
# ==============================================================================

# Hardware / Procfs Paths
# video_device prefix matches /dev/video* (e.g. /dev/video0, /dev/video1, /dev/video10)
video_device = /dev/video
detect_audio = true
detect_pipewire = true
status_file = /tmp/protector.status
cgroup_mount = /sys/fs/cgroup
proc_mount = /proc

# Timing Parameters
poll_interval_ms = 1000
hysteresis_delay_sec = 8

# Resource Shaping Parameters
protected_cpu_weight = 800
protected_io_weight = 800
background_cpu_weight = 20
starvation_floor_cpu_weight = 5
aging_increment = 10
aging_interval_sec = 15
aging_ceiling_cpu_weight = 100
background_memory_high_percent = 60

# Safety / Simulation Mode
dry_run = false
